{% extends "base.html" %}
{% block content %}
<h2>{{ entry['title'] }}</h2>
<p>Created at: {{ entry['created_at'] }}</p>

<div>
    {{ entry['body'] }}
</div>

<form method="post" action="{{ url_for('delete_entry', entry_id=entry['id']) }}">
    <a href="{{ url_for('edit_entry', entry_id=entry['id']) }}">Edit</a>
    <button type="submit">Delete</button>
</form>
{% endblock %}
