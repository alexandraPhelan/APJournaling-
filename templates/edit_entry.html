{% extends "base.html" %}
{% block content %}
<h2>Edit Entry</h2>

<form method="post">
    <label>Title</label><br>
    <input type="text" name="title" value="{{ entry['title'] }}"><br><br>

    <label>Body</label><br>
    <textarea name="body" rows="8" cols="60">{{ entry['body'] }}</textarea><br><br>

    <button type="submit">Update</button>
</form>
{% endblock %}
