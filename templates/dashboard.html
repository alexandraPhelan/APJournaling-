{% extends "base.html" %}
{% block content %}
<h2>Your Journal Entries</h2>

<p><a href="{{ url_for('create_entry') }}">Create new entry</a></p>

{% if entries %}
    <ul>
    {% for e in entries %}
        <li>
            <a href="{{ url_for('view_entry', entry_id=e['id']) }}">
                {{ e['title'] }} ({{ e['created_at'] }})
            </a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>You have no entries yet.</p>
{% endif %}
{% endblock %}
